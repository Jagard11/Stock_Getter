{% extends "base.html" %}

{% block title %}Edit Task #{{ task.id }}{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Task #{{ task.id }}</h2>

    <form action="/db/{{ database_id }}/bug/{{ task.id }}/edit" method="post">
        <div class="form-group">
            <label for="summary">Summary:</label>
            <input type="text" id="summary" name="summary" value="{{ task.summary }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" required>{{ task.description }}</textarea>
        </div>

        <div class="form-group">
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="bug" {% if task.type == 'bug' %}selected{% endif %}>Bug</option>
                <option value="task" {% if task.type == 'task' %}selected{% endif %}>Task</option>
                <option value="feature" {% if task.type == 'feature' %}selected{% endif %}>Feature</option>
            </select>
        </div>

        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="active" {% if task.status == 'active' %}selected{% endif %}>Active</option>
                <option value="fixed" {% if task.status == 'fixed' %}selected{% endif %}>Fixed</option>
                <option value="wontfix" {% if task.status == 'wontfix' %}selected{% endif %}>Won't Fix</option>
                <option value="duplicate" {% if task.status == 'duplicate' %}selected{% endif %}>Duplicate</option>
            </select>
        </div>

        <div class="form-group">
            <label for="severity">Severity:</label>
            <select id="severity" name="severity" required>
                <option value="Critical" {% if task.severity == 'Critical' %}selected{% endif %}>Critical</option>
                <option value="High" {% if task.severity == 'High' %}selected{% endif %}>High</option>
                <option value="Medium" {% if task.severity == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Low" {% if task.severity == 'Low' %}selected{% endif %}>Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority">Priority:</label>
            <select id="priority" name="priority" required>
                <option value="Critical" {% if task.priority == 'Critical' %}selected{% endif %}>Critical</option>
                <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="additional_info">Additional Information:</label>
            <textarea id="additional_info" name="additional_info">{{ task.additional_info or '' }}</textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn">Save Changes</button>
            <a href="/db/{{ database_id }}/bug/{{ task.id }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
