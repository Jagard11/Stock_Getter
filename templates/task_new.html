{% extends "base.html" %}

{% block title %}Create New Task{% endblock %}

{% block content %}
<div class="card">
    <h2>Create New Task</h2>

    <form action="/db/{{ database_id }}/bug/new" method="post">
        <div class="form-group">
            <label for="summary">Summary:</label>
            <input type="text" id="summary" name="summary" placeholder="Brief description of the task" required>
        </div>

        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" placeholder="Detailed description of the task" required></textarea>
        </div>

        <div class="form-group">
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="task" selected>Task</option>
                <option value="bug">Bug</option>
                <option value="feature">Feature</option>
            </select>
        </div>

        <div class="form-group">
            <label for="severity">Severity:</label>
            <select id="severity" name="severity" required>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority">Priority:</label>
            <select id="priority" name="priority" required>
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>

        <div class="form-group">
            <label for="additional_info">Additional Information (Optional):</label>
            <textarea id="additional_info" name="additional_info" placeholder="Any additional notes or information"></textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn">Create Task</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
